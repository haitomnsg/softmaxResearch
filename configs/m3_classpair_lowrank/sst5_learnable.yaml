name: m3_classpair_lowrank_learnable_sst5
seed: 42

# M3' — same class-pair low-rank margin as sst5.yaml, but learnable_margin=True
# routes gradient (via a straight-through estimator) into the margin's u/v so the
# class-pair structure actually trains instead of staying at random init. This is
# the variant H1 needs to test the real hypothesis (the fixed-random M3 tied AS-Softmax).

dataset:
  name: sst5
  batch_size: 16          # 6 GB VRAM ceiling (RTX 3050); matches baseline configs
  max_seq_len: 128
  num_workers: 0

model:
  backbone: bert-base-uncased
  dropout: 0.1

loss:
  type: gam_softmax
  learnable_margin: true                          # turn on the STE gradient path to u/v
  ste_temp: 0.1                                   # sigmoid-surrogate temperature
  margin:
    type: classpair_lowrank
    rank: 8                                        # docs §2.3 default
    init_std: 0.02                                # σ(u·v/√k) ≈ 0.5 at init → margin near midpoint
    schedule:
      type: linear
      delta_min: 0.05
      delta_max: 0.4                              # docs §8 default recipe
      warmup_frac: 0.3                            # ramp δ_max over first 30% of training

training:
  optimizer: adamw
  lr: 2.0e-5
  weight_decay: 0.01
  epochs: 3          # match the 3-epoch baselines for an apples-to-apples H1 comparison
  grad_clip: 1.0
  log_every: 50

logging:
  wandb_project: gam-softmax
  wandb_tags: [phase2, sst5, m3_learnable, gam_softmax]
