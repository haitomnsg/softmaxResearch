name: phase_c_m4v2
seed: 42

# PHASE C' (docs/10_noisy_label_plan.md §3, pre-registered 2026-10-08). Identical to
# configs/phase_c/m4.yaml except the suspicion statistic: margin type `loss_mixture`.
# The δ formula, β = 1, ramp 0 → 30%, clamps and the AS base (δ = 0.15) are frozen.

dataset:
  name: 20newsgroups
  batch_size: 16
  eval_batch_size: 64      # eval-only; no effect on results, ~3x faster validation
  max_seq_len: 128
  num_workers: 0
  noisy_val_frac: 0.1       # held-out NOISY split for model selection

model:
  backbone: bert-base-uncased
  dropout: 0.1

loss:
  type: gam_softmax
  learnable_margin: false        # this margin has no learnable parameters
  margin:
    type: loss_mixture
    beta: 1.0                    # max per-sample deviation from the base margin
    ema_momentum: 0.5            # per-sample EMA of -log p_t across visits
    refit_every: 100             # steps between 1- vs 2-component mixture refits (BIC-gated)
    em_iters: 20
    min_seen_frac: 0.5           # neutral (= AS-Softmax) until half the train set has been seen
    reject_warmup_frac: 0.0      # matched to small-loss: β ramps from step 0 ...
    reject_ramp_end: 0.3         # ... to full strength at 30%, then holds (Co-teaching shape)
    delta_floor: -1.0            # allow full sample rejection
    delta_ceiling: 0.15          # one-sided: never tighter than AS-Softmax
    schedule:
      type: linear
      delta_min: 0.0
      delta_max: 0.15            # == as_softmax delta
      warmup_frac: 0.1           # == as_softmax warmup_frac

training:
  optimizer: adamw
  lr: 2.0e-5
  weight_decay: 0.01
  epochs: 8
  grad_clip: 1.0
  log_every: 200

logging:
  wandb_project: gam-softmax
  wandb_tags: [phase_c_prime, 20ng, m4v2]
