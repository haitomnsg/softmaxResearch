name: final_20ng_softmax
seed: 42

# FINAL EXPERIMENT (E1) — robustness under symmetric label noise, 20 Newsgroups.
# All five configs in configs/final/ share identical dataset/model/training blocks;
# the ONLY difference is the `loss:` block. Noise level is set per-run with
# `--label-noise`. Driver: experiments/final_experiment.py

dataset:
  name: 20newsgroups
  batch_size: 16
  eval_batch_size: 64      # eval-only; no effect on results, ~3x faster validation
  max_seq_len: 128
  num_workers: 0

model:
  backbone: bert-base-uncased
  dropout: 0.1

loss:
  type: softmax
  label_smoothing: 0.0

training:
  optimizer: adamw
  lr: 2.0e-5
  weight_decay: 0.01
  epochs: 4
  grad_clip: 1.0
  log_every: 200

logging:
  wandb_project: gam-softmax
  wandb_tags: [final, 20ng, softmax]
