name: power_softmax_sst5
seed: 42

dataset:
  name: sst5
  batch_size: 16
  max_seq_len: 128
  num_workers: 0

model:
  backbone: bert-base-uncased
  dropout: 0.1

loss:
  type: power_softmax
  gamma: 2.0
  eps: 1.0e-6

training:
  optimizer: adamw
  lr: 2.0e-5
  weight_decay: 0.01
  epochs: 5
  grad_clip: 1.0
  log_every: 50

logging:
  wandb_project: gam-softmax
  wandb_tags: [baseline, sst5, power_softmax]
