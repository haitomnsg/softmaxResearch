name: softmax_20ng
seed: 42

dataset:
  name: 20newsgroups
  batch_size: 16
  max_seq_len: 128
  num_workers: 0

model:
  backbone: bert-base-uncased
  dropout: 0.1

loss:
  type: softmax
  label_smoothing: 0.0

training:
  optimizer: adamw
  lr: 2.0e-5
  weight_decay: 0.01
  epochs: 4
  grad_clip: 1.0
  log_every: 100

logging:
  wandb_project: gam-softmax
  wandb_tags: [baseline, 20ng, softmax]
